[project]
name = "warehouse-bigdata"
version = "0.1.0"
description = "Batch-oriented big-data inventory decision-support prototype"
readme = "README.md"
authors = [
    { name = "Pham Tat Dat", email = "datphamtat19@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.4,<2",
    "pyarrow>=19,<24",
    "clickhouse-connect>=0.8,<1",
    "streamlit>=1.36,<2",
]

[project.scripts]
warehouse-bigdata = "warehouse_bigdata.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
spark-test = [
    "pyspark==3.5.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '--import-mode=importlib -m "not integration"'
markers = [
    "integration: opt-in checks against existing running services",
    "m5_small: read-only canonical small artifacts requiring --run-small-integration",
    "small_acceptance: serial live M5 Small execution requiring --run-small-acceptance",
    "m05_published: read-only J04 publication acceptance requiring --run-m05-published",
    "m05_lifecycle: live J04 publication and recovery requiring --run-m05-lifecycle",
    "hdfs_disruptive: serial HDFS lifecycle/failure checks requiring an explicit maintenance window",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
