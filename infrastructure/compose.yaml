name: warehouse-bigdata

x-hdfs-common: &hdfs-common
  image: apache/hadoop:3.4.3@sha256:127774dadab40ce84df7ac668a7a8c99945688b3fe336f1388f4477ca33e1529
  platform: linux/amd64
  user: "1000:100"
  entrypoint: ["dumb-init", "--", "/bin/bash", "/opt/warehouse-hdfs/lifecycle.sh"]
  environment: &hdfs-environment
    HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    HADOOP_HEAPSIZE_MIN: "128"
    HADOOP_HEAPSIZE_MAX: "512"
  networks: [warehouse-bigdata]
  cpus: 1.0
  restart: "on-failure:3"
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  hdfs-namenode:
    <<: *hdfs-common
    hostname: hdfs-namenode
    command: ["namenode"]
    mem_limit: 1g
    ports:
      - "127.0.0.1:9870:9870"
    expose: ["8020", "9870"]
    volumes:
      - &core-config
        type: bind
        source: ./hadoop/core-site.xml
        target: /opt/hadoop/etc/hadoop/core-site.xml
        read_only: true
        bind:
          create_host_path: false
      - &hdfs-config
        type: bind
        source: ./hadoop/hdfs-site.xml
        target: /opt/hadoop/etc/hadoop/hdfs-site.xml
        read_only: true
        bind:
          create_host_path: false
      - &lifecycle-script
        type: bind
        source: ./hadoop/lifecycle.sh
        target: /opt/warehouse-hdfs/lifecycle.sh
        read_only: true
        bind:
          create_host_path: false
      - &healthcheck-script
        type: bind
        source: ./hadoop/healthcheck.sh
        target: /opt/warehouse-hdfs/healthcheck.sh
        read_only: true
        bind:
          create_host_path: false
      - hdfs-namenode-data:/var/lib/hdfs/name
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/warehouse-hdfs/healthcheck.sh", "namenode"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  hdfs-datanode-1:
    <<: *hdfs-common
    hostname: hdfs-datanode-1
    command: ["datanode"]
    mem_limit: 768m
    environment:
      <<: *hdfs-environment
      HADOOP_HEAPSIZE_MAX: "256"
      HDFS_DATANODE_HOSTNAME: hdfs-datanode-1
    expose: ["9866", "9867", "9864"]
    volumes:
      - *core-config
      - *hdfs-config
      - *lifecycle-script
      - *healthcheck-script
      - hdfs-datanode-1-data:/var/lib/hdfs/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck: &datanode-healthcheck
      test: ["CMD", "/bin/bash", "/opt/warehouse-hdfs/healthcheck.sh", "datanode"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  hdfs-datanode-2:
    <<: *hdfs-common
    hostname: hdfs-datanode-2
    command: ["datanode"]
    mem_limit: 768m
    environment:
      <<: *hdfs-environment
      HADOOP_HEAPSIZE_MAX: "256"
      HDFS_DATANODE_HOSTNAME: hdfs-datanode-2
    expose: ["9866", "9867", "9864"]
    volumes:
      - *core-config
      - *hdfs-config
      - *lifecycle-script
      - *healthcheck-script
      - hdfs-datanode-2-data:/var/lib/hdfs/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    healthcheck: *datanode-healthcheck

  hdfs-init:
    <<: *hdfs-common
    profiles: [init]
    user: "0:0"
    command: ["init"]
    mem_limit: 512m
    environment:
      <<: *hdfs-environment
      HADOOP_HEAPSIZE_MAX: "256"
    restart: "no"
    volumes:
      - *core-config
      - *hdfs-config
      - *lifecycle-script
      - hdfs-namenode-data:/var/lib/hdfs/name
      - hdfs-datanode-1-data:/var/lib/hdfs/datanode-1
      - hdfs-datanode-2-data:/var/lib/hdfs/datanode-2

  spark-master:
    <<: &spark-common
      image: warehouse-bigdata-spark:3.5.7-python3.11.17
      build:
        context: ./spark
      platform: linux/amd64
      profiles: [spark]
      user: "185:185"
      networks: [warehouse-bigdata]
      read_only: true
      restart: "on-failure:3"
      stop_grace_period: 60s
      volumes:
        - *core-config
        - *hdfs-config
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
    hostname: spark-master
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_MASTER_OPTS: -Dspark.master.rest.enabled=false
    cpus: 0.5
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=67108864,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    expose: ["7077", "8080"]
    healthcheck:
      test: ["CMD", "/opt/python/bin/python3.11", "/opt/warehouse-spark/healthcheck.py", "master"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  spark-worker-1:
    <<: *spark-common
    hostname: spark-worker-1
    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-1
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "1"
      - --memory
      - 1024m
      - --work-dir
      - /tmp/warehouse-spark/work
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_HOST: spark-worker-1
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/opt/warehouse-spark/native
      SPARK_DAEMON_JAVA_OPTS: -Xms128m -Djava.io.tmpdir=/opt/warehouse-spark/native
      SPARK_WORKER_OPTS: &spark-worker-options >-
        -Dspark.worker.cleanup.enabled=true
        -Dspark.worker.cleanup.interval=300
        -Dspark.worker.cleanup.appDataTtl=3600
    cpus: 1.0
    mem_limit: 2g
    tmpfs: &spark-worker-scratch
      - /tmp:rw,nosuid,nodev,noexec,size=234881024,mode=1777
      - /opt/warehouse-spark/native:rw,exec,nosuid,nodev,size=33554432,uid=185,gid=185,mode=0700
    expose: ["7078", "8081"]
    depends_on: &spark-worker-dependencies
      spark-master:
        condition: service_healthy
    healthcheck: &spark-worker-healthcheck
      test: ["CMD", "/opt/python/bin/python3.11", "/opt/warehouse-spark/healthcheck.py", "worker"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  spark-worker-2:
    <<: *spark-common
    hostname: spark-worker-2
    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-2
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "1"
      - --memory
      - 1024m
      - --work-dir
      - /tmp/warehouse-spark/work
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_HOST: spark-worker-2
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/opt/warehouse-spark/native
      SPARK_DAEMON_JAVA_OPTS: -Xms128m -Djava.io.tmpdir=/opt/warehouse-spark/native
      SPARK_WORKER_OPTS: *spark-worker-options
    cpus: 1.0
    mem_limit: 2g
    tmpfs: *spark-worker-scratch
    expose: ["7078", "8081"]
    depends_on: *spark-worker-dependencies
    healthcheck: *spark-worker-healthcheck

  spark-submit:
    image: warehouse-bigdata-spark-submit:3.5.7-python3.11.17
    build:
      context: ..
      dockerfile: infrastructure/spark/submit.Dockerfile
    platform: linux/amd64
    profiles: [spark-submit]
    user: "185:185"
    entrypoint: ["/usr/bin/tini", "-g", "--", "/opt/warehouse-app/.venv/bin/warehouse-bigdata", "spark-submit"]
    networks: [warehouse-bigdata]
    environment:
      WAREHOUSE_ENV: container
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/opt/warehouse-spark/native
      WAREHOUSE_SPARK_MASTER_URL: spark://spark-master:7077
      WAREHOUSE_HDFS_URI: hdfs://hdfs-namenode:8020
      WAREHOUSE_HDFS_BASE_PATH: /data/warehouse
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    cpus: 1.0
    mem_limit: 1536m
    read_only: true
    restart: "no"
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=100663296,mode=1777
      - /opt/warehouse-spark/native:rw,exec,nosuid,nodev,size=33554432,uid=185,gid=185,mode=0700
    expose: ["7079", "7080"]
    volumes:
      - *core-config
      - *hdfs-config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  warehouse-bigdata:
    name: warehouse-bigdata
    driver: bridge

volumes:
  hdfs-namenode-data:
  hdfs-datanode-1-data:
  hdfs-datanode-2-data:
